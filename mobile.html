/* ===================================================================
   CLOUD SYNC — compatible with desktop v35.1 fund_state table
=================================================================== */
let supabaseClient = null;
let cloudSubscription = null;
let cloudPushTimer = null;
let cloudLastPushedJson = null;
let cloudConnected = false;

function loadCloudConfig() {
  try {
    const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}
function saveCloudConfig(cfg) {
  localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg));
}
function clearCloudConfig() {
  localStorage.removeItem(CLOUD_CONFIG_KEY);
}

async function initCloud(cfg) {
  if (!cfg || !cfg.url || !cfg.key || !cfg.secret) return false;
  if (typeof supabase === 'undefined') {
    console.error('Supabase SDK not loaded');
    showToast('Supabase SDK not loaded — check internet', 'neg');
    return false;
  }
  try {
    supabaseClient = supabase.createClient(cfg.url, cfg.key, {
      realtime: { params: { eventsPerSecond: 10 } }
    });
    updateCloudIndicator('syncing');

    // Pull
    const remote = await pullFromCloud(cfg.secret);
    if (remote && remote.data) {
      const localCount = (state.positions || []).length;
      const remoteCount = (remote.data.positions || []).length;
      const localUpdatedAt = state.fund?.lastSyncedAt ? new Date(state.fund.lastSyncedAt) : new Date(0);
      const remoteUpdatedAt = new Date(remote.updated_at);

      if (remoteCount > 0 && (localCount === 0 || remoteUpdatedAt > localUpdatedAt)) {
        state = normalizeState(remote.data);
        state.fund.lastSyncedAt = remote.updated_at;
        saveStateLocalOnly();
        renderActiveScreen();
        lastSyncTime = new Date().toISOString();
      } else if (localCount > 0) {
        await pushToCloud(cfg.secret);
      }
    } else if ((state.positions || []).length > 0) {
      await pushToCloud(cfg.secret);
    }

    // Subscribe to realtime changes
    if (cloudSubscription) {
      try { await supabaseClient.removeChannel(cloudSubscription); } catch(e) {}
    }
    let debounce, pending = false;
    cloudSubscription = supabaseClient
      .channel('fund-state-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'fund_state' }, async () => {
        if (pending) return;
        pending = true;
        clearTimeout(debounce);
        debounce = setTimeout(async () => {
          pending = false;
          try {
            const r = await pullFromCloud(cfg.secret);
            if (!r || !r.data) return;
            const rj = JSON.stringify(r.data);
            if (rj === cloudLastPushedJson) return; // own write echo
            if (rj === JSON.stringify(state)) return;
            state = normalizeState(r.data);
            state.fund.lastSyncedAt = r.updated_at;
            saveStateLocalOnly();
            renderActiveScreen();
            lastSyncTime = new Date().toISOString();
            showToast('Synced from MacBook', 'pos');
          } catch(e) { console.warn('rt pull', e); }
        }, 700);
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          cloudConnected = true;
          updateCloudIndicator('connected');
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          updateCloudIndicator('error');
        }
      });

    return true;
  } catch (e) {
    console.error('initCloud', e);
    updateCloudIndicator('error');
    return false;
  }
}

async function pullFromCloud(secret) {
  if (!supabaseClient) return null;
  try {
    const { data, error } = await supabaseClient
      .from('fund_state')
      .select('data, updated_at, secret')
      .eq('id', 'main')
      .maybeSingle();
    if (error) { console.warn('pull', error); return null; }
    if (!data) return null;
    if (data.secret !== secret) {
      updateCloudIndicator('error');
      showToast('Secret mismatch — wrong passphrase', 'neg');
      return null;
    }
    return data;
  } catch(e) { console.warn('pull fail', e); return null; }
}

async function pushToCloud(secret) {
  if (!supabaseClient || !secret) return false;
  try {
    const payload = JSON.stringify(state);
    cloudLastPushedJson = payload;
    const { error } = await supabaseClient
      .from('fund_state')
      .upsert({
        id: 'main',
        data: state,
        updated_at: new Date().toISOString(),
        secret: secret
      }, { onConflict: 'id' });
    if (error) { console.warn('push', error); return false; }
    lastSyncTime = new Date().toISOString();
    return true;
  } catch(e) { console.warn('push fail', e); return false; }
}

function scheduleCloudPush() {
  if (!cloudConnected) return;
  const cfg = loadCloudConfig();
  if (!cfg) return;
  clearTimeout(cloudPushTimer);
  updateCloudIndicator('syncing');
  cloudPushTimer = setTimeout(async () => {
    await pushToCloud(cfg.secret);
    updateCloudIndicator('connected');
  }, 1200);
}

function saveStateLocalOnly() {
  try {
    const json = JSON.stringify(state);
    localStorage.setItem(STORAGE_KEY, json);
    localStorage.setItem(BACKUP_KEY, json);
  } catch(e) { console.error('local save', e); }
}

function updateCloudIndicator(status) {
  const btn = document.getElementById('cloudIndicator');
  const dot = document.getElementById('cloudDot');
  if (!btn || !dot) return;
  if (status === 'connected') {
    btn.classList.add('is-on');
    dot.style.background = 'var(--pos)';
    dot.style.boxShadow = '0 0 8px var(--pos)';
  } else if (status === 'syncing') {
    btn.classList.add('is-on');
    dot.style.background = 'var(--accent)';
    dot.style.boxShadow = '0 0 8px var(--accent-glow)';
  } else if (status === 'error') {
    btn.classList.remove('is-on');
    dot.style.background = 'var(--neg)';
    dot.style.boxShadow = '';
  } else {
    btn.classList.remove('is-on');
    dot.style.background = 'var(--ink-mute)';
    dot.style.boxShadow = '';
  }
}

async function manualSync() {
  const cfg = loadCloudConfig();
  if (!cfg) {
    showToast('Set up cloud sync in More → Settings', 'neg');
    return;
  }
  const btn = document.getElementById('syncBtn');
  btn.style.transform = 'rotate(360deg)';
  btn.style.transition = 'transform 0.8s';
  setTimeout(() => { btn.style.transform = ''; btn.style.transition = ''; }, 850);
  if (!supabaseClient) { await initCloud(cfg); return; }
  updateCloudIndicator('syncing');
  const r = await pullFromCloud(cfg.secret);
  if (r && r.data) {
    state = normalizeState(r.data);
    saveStateLocalOnly();
    renderActiveScreen();
    lastSyncTime = new Date().toISOString();
    showToast('✓ Pulled latest from cloud', 'pos');
  }
  updateCloudIndicator(cloudConnected ? 'connected' : 'idle');
}
window.manualSync = manualSync;

function openCloudStatus() {
  const cfg = loadCloudConfig();

    openSheet(`

    `);
    return;

    <div class="sheet-sub">${cloudConnected ? '● Connected' : '○ Disconnected'}</div>
    <div class="sheet-row"><span class="lbl">Database</span><span class="val" style="font-size:11px">${escapeHtml((cfg.url||'').replace('https://','').split('.')[0])}…</span></div>
    <div class="sheet-row"><span class="lbl">Last sync</span><span class="val">${lastSyncTime ? fmtRelative(lastSyncTime) : 'never'}</span></div>
    <div class="sheet-row"><span class="lbl">Positions</span><span class="val">${state.positions.length}</span></div>
    <div class="sheet-row"><span class="lbl">Transactions</span><span class="val">${(state.transactions||[]).length}</span></div>
    <div class="sheet-actions">
      <button class="btn" onclick="closeSheet()">Close</button>
      <button class="btn btn-primary" onclick="closeSheet(); manualSync()">Pull Now</button>
    </div>
  `);
}
window.openCloudStatus = openCloudStatus;


/* ===================================================================
   PULL-TO-REFRESH
=================================================================== */
function setupPullToRefresh() {
  let startY = 0, currentY = 0, dragging = false, threshold = 80;
  let indicator = null;

  document.querySelectorAll('.screen').forEach(scr => {
    scr.addEventListener('touchstart', (e) => {
      if (scr.scrollTop > 4) return;
      startY = e.touches[0].clientY;
      dragging = true;
      if (indicator) { indicator.remove(); indicator = null; }
    }, { passive: true });

    scr.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      currentY = e.touches[0].clientY;
      const dy = currentY - startY;
      if (dy < 8) return;
      if (!indicator) {
        indicator = document.createElement('div');
        indicator.className = 'ptr-indicator is-show';
        indicator.innerHTML = '⟳';
        scr.appendChild(indicator);
      }
      const pull = Math.min(dy, threshold * 1.6);
      indicator.style.transform = `translateX(-50%) translateY(${Math.min(pull, 50)}px)`;
      indicator.style.opacity = String(Math.min(dy / threshold, 1));
    }, { passive: true });

    scr.addEventListener('touchend', () => {
      if (!dragging) return;
      const dy = currentY - startY;
      dragging = false;
      if (dy >= threshold) {
        if (indicator) indicator.classList.add('is-spin');
        manualSync().finally(() => {
          if (indicator) indicator.remove();
          indicator = null;
        });
      } else {
        if (indicator) indicator.remove();
        indicator = null;
      }
      startY = 0; currentY = 0;
    });
  });
}

/* ===================================================================
   BOOTSTRAP
=================================================================== */
async function boot() {
  // Initial state already loaded
  renderHome();
  setupPullToRefresh();

  // Try to connect cloud silently
  const cfg = loadCloudConfig();
  if (cfg) {
    initCloud(cfg).then(ok => {
      if (!ok) updateCloudIndicator('error');
    });
  } else {
    updateCloudIndicator('idle');
  }

  // PWA service worker
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('sw.js');
      console.log('[PWA] Service worker registered');
    } catch(e) {
      console.warn('[PWA] SW registration failed', e);
    }
  }

  // Hide loader, reveal app
  setTimeout(() => {
    document.getElementById('loader').classList.add('fade-out');
    document.getElementById('app').style.opacity = '1';
    setTimeout(() => { document.getElementById('loader').remove(); }, 500);
  }, 500);
}

window.addEventListener('load', boot);

/* ===================================================================
   GLOBAL SAFETY: prevent zoom on double-tap inside app
=================================================================== */
document.addEventListener('gesturestart', (e) => e.preventDefault());
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch < 300) {
    e.preventDefault();
  }
  lastTouch = now;
}, { passive: false });

</script>
